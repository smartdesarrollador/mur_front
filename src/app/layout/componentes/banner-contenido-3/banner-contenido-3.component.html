<section
  *ngFor="let item of listBanners"
  class="relative bg-cover bg-center bg-no-repeat bg-gray-700 h-[320px] sm:h-screen"
>
  <div
    class="absolute inset-0 bg-[url('assets/images/banners/nuestro-equipo.jpg')] bg-cover bg-no-repeat"
    style="background-size: 100% auto; background-position: center top"
    [ngStyle]="{
      'background-image': 'url(' + urlRaiz + item.ruta_imagen + ')'
    }"
  ></div>

  <!-- Degradado negro en la parte inferior -->
  <div
    class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"
  ></div>

  <!-- Contenedor para el texto -->
  <div class="absolute bottom-0 w-full text-center pb-6">
    <h1 class="text-white text-4xl font-titulo">Nuestro equipo</h1>
  </div>
</section>
