<h1 class="ml-24 text-5xl">Mas</h1>
<h1 class="ml-24 text-5xl">noticias</h1>

@for (item of listInformativos; track item.id) { @if(item.destacado == "true"){
<div class="w-full mt-7">
  <div
    class="max-w-sm mx-auto bg-gray-100 rounded-lg shadow-md overflow-hidden"
  >
    <!-- Image Section -->
    <div class="relative">
      <img
        class="w-full h-48 object-cover"
        src="{{ urlRaiz + item.ruta_imagen }}"
        alt="Business meeting"
      />
    </div>
    <!-- Content Section -->
    <div class="p-4">
      <h2 class="text-3xl text-center font-bold mt-5 text-gray-800 p-4">
        {{ item.titulo }}
      </h2>
      {{ item.resumen }}
      <div class="mt-4 flex justify-center">
        <a
          (click)="onDetail(item)"
          target="_blank"
          class="bg-yellow-300 hover:bg-yellow-400 text-white font-bold py-2 mb-5 px-4 rounded-lg cursor-pointer"
        >
          Ver mas...
        </a>
      </div>
    </div>
  </div>
</div>
} }
