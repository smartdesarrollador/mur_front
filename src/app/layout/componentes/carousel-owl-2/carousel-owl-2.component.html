<owl-carousel-o [options]="customOptions">
  <ng-template *ngFor="let item of listBanners" carouselSlide>
    <div class="w-full px-4 md:px-12 mb-5">
      <div class="flex flex-col justify-center">
        <div
          class="group h-96 md:h-[400px] mb-10 w-full md:w-[300px] relative [perspective:1000px]"
        >
          <div class="relative">
            <img
              class="h-full w-full object-cover"
              src="{{ urlRaiz + item.ruta_imagen }}"
            />
            <div
              class="absolute max-w-7xl h-28 bottom-0 left-0 right-0 bg-black bg-opacity-50 text-white p-4 text-left"
            >
              <h3 class="text-lg sm:text-2xl font-bold">{{ item.titulo }}</h3>
              <h4 class="text-sm sm:text-lg">{{ item.cargo }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</owl-carousel-o>
