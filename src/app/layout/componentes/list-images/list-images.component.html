<div class="px-4 my-20">
  <h2
    class="text-2xl sm:text-3xl md:text-4xl text-gray-700 font-semibold mb-4 font-subtitulo inline"
  >
    {{ "TITULO_INDUSTRIAS" | translate }}
  </h2>
  <div class="grid grid-cols-1 md:grid-cols-5 my-10">
    <div
      *ngFor="let industria of industrias"
      class="flex items-center justify-center bg-gray-200"
    >
      <div class="relative">
        <img src="{{ urlRaiz + industria.ruta_imagen }}" alt="" />
        <div class="absolute inset-0 flex items-center justify-center">
          <span class="text-white text-2xl font-bold">{{
            industria.titulo
          }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
