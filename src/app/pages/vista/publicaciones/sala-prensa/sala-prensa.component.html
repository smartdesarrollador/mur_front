<app-banner-3></app-banner-3>
<!-- Buttons Section -->

<div class="container mx-auto max-w-7xl mt-10">
  <div
    class="grid grid-cols-1 md:flex justify-center md:mt-4 md:space-x-4 md:gap-24"
  >
    <div class="flex justify-center">
      <button
        routerLink="/publicaciones/informativo"
        class="text-gray-800 font-bold py-1 px-14 text-2xl rounded-md"
      >
        {{ "TITULO_INFORMATIVO" | translate }}
      </button>
    </div>
    <div class="flex justify-center pl-5 sm:border-l sm:border-gray-700">
      <button
        routerLink="/publicaciones/sala-de-prensa"
        class="bg-[#606060] hover:bg-[#495464] text-white font-bold pb-1 px-14 text-2xl rounded-md"
      >
        {{ "TITULO_SALA" | translate }}
      </button>
    </div>
  </div>
  <hr class="border-1 my-4 border-gray-400" />

  <div class="flex my-14 flex-wrap">
    <div
      *ngFor="
        let item of listSalas | paginate : { itemsPerPage: 6, currentPage: p };
        let i = index
      "
      class="w-full md:w-1/3 mb-14"
    >
      <div
        class="max-w-sm mx-auto bg-gray-100 rounded-lg shadow-md overflow-hidden"
      >
        <!-- Image Section -->
        <!--  <div class="relative">
          <img
            class="w-full h-48 object-cover"
            [src]="urlRaiz + item.ruta_imagen"
            alt="Business meeting"
          />
        </div> -->
        <!-- Content Section -->

        <iframe
          class="w-full h-56"
          [src]="getSanitizedUrl(item.link)"
          title="Learning About Regulatory Compliance in Banking PART 1"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <div class="p-4">
          <h2 class="text-xl font-bold mt-1 text-gray-800 py-4">
            {{ item.titulo }}
          </h2>
          <div class="ql-container ql-snow" style="border-width: 0">
            <div class="ql-editor" [innerHTML]="safeHtmlList[i]"></div>
          </div>
          <div class="mt-4 flex justify-center">
            <a
              href="{{ item.link }}"
              target="_blank"
              class="bg-[#606060] hover:bg-[#495464] text-white font-bold py-2 mb-5 px-4 rounded-lg"
            >
              {{ "VER_MAS_MINUSCULA" | translate }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="flex items-center justify-center">
    <pagination-controls
      (pageChange)="p = $event"
      previousLabel="Anterior"
      nextLabel="Siguiente"
    ></pagination-controls>
  </div>
</div>
