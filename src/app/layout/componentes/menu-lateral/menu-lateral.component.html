<div class="flex">
  <!-- Sidebar -->
  <div class="w-64 bg-gray-100">
    <ul class="p-4">
      <li
        *ngFor="let item of menuItems; let i = index"
        class="cursor-pointer py-2 hover:bg-gray-200"
        [class.bg-gray-300]="i === selectedIndex"
        (click)="selectItem(i)"
      >
        {{ item.title }}
      </li>
    </ul>
  </div>

  <!-- Content -->
  <div class="flex-1 p-8">
    <h2 class="text-2xl font-bold mb-4">{{ selectedItem?.title }}</h2>
    <p class="font-parrafo text-lg sm:text-2xl mt-10 text-justify">
      {{ selectedItem?.description }}
    </p>
    <a
      routerLink="/areas/servicio"
      class="text-yellow-400 font-parrafo text-lg sm:text-2xl mt-10 text-justify"
      >{{ selectedItem?.enlace }}</a
    >
  </div>
</div>
